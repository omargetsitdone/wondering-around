name: Daily job scan

on:
  schedule:
    - cron: "17 5 * * *"   # 05:17 UTC = 06:17/07:17 Amsterdam
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run scan
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_ACTOR: misceres~indeed-scraper
        run: python scan.py
      - name: Commit results
        run: |
          git config user.name "job-scan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Scan $(date -u +%F)"
          git push
